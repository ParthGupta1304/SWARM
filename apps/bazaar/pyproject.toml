[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtest-bazaar"
version = "0.1.0"
description = "Deliberately vulnerable marketplace target for Swarmtest"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["bazaar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
