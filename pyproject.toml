[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtest"
version = "0.1.0"
description = "Swarmtest — multi-agent testing system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "openai>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.23.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23,<5",
    "sqlalchemy>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
swarmtest = "swarm.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
charts = ["matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["detect*", "verify*", "bench*", "memory*", "swarm*", "adapters*", "apps*", "mock_bazaar*", "dashboard*", "configs*"]
exclude = ["apps.bazaar.web*", "apps.bazaar.static*", "apps.bazaar.tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.setuptools.package-data]
"apps.bazaar" = ["seed_data.json", "openapi.json", "invariants.sql", "static/**/*", "static/*"]
"dashboard" = ["*.html", "*.css", "*.js"]
"configs" = ["*.yaml", "*.json"]
