services:
  phase1:
    build:
      context: .
      dockerfile: apps/bazaar/Dockerfile
    command: ["python", "-m", "swarm.demo", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWARMTEST_PROVIDER_URL: ${SWARMTEST_PROVIDER_URL:-https://api.groq.com/openai/v1}
      SWARMTEST_MODEL: ${SWARMTEST_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SWARMTEST_API_KEY: ${SWARMTEST_API_KEY:-}
    volumes:
      - ./artifacts/docker-phase1:/app/artifacts/phase1
