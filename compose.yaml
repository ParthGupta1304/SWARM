services:
  phase1:
    build:
      context: .
      dockerfile: apps/bazaar/Dockerfile
    command: ["python", "-m", "swarm.demo", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SWARMTEST_PROVIDER_URL: ${SWARMTEST_PROVIDER_URL:-http://host.docker.internal:11434/v1}
      SWARMTEST_MODEL: ${SWARMTEST_MODEL:-qwen2.5-coder:7b}
      SWARMTEST_API_KEY: ${SWARMTEST_API_KEY:-}
    volumes:
      - ./artifacts/docker-phase1:/app/artifacts/phase1
